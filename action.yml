name: "Cached LFS checkout with submodule support"

description: "Git checkout with LFS files from cache"

branding:
  icon: "download"
  color: "green"

inputs:
  include:
    description: "Explicitly include files for LFS"
    required: false
    default: "*"
  exclude:
    description: "Explicitly exclude files for LFS"
    required: false
    default: ""
  fetch-depth:
    description: "Number of commits to fetch. 0 indicates all history for all tags and branches"
    required: false
    default: 1
  clean:
    description: "Whether to execute `git clean -ffdx && git reset --hard HEAD` before fetching"
    required: false
    default: true
  filter:
    description: >
      Partially clone against a given filter.
      Overrides sparse-checkout if set.
    default: ""
  path:
    description: 'Relative path under $GITHUB_WORKSPACE to place the repository'
    required: false
    default: ''
  ref:
    description: >
      The branch, tag or SHA to checkout. When checking out the repository that
      triggered a workflow, this defaults to the reference or SHA for that
      event.  Otherwise, uses the default branch.
    required: false
    default: ""
  repository:
    description: "Repository name with owner. For example, actions/checkout"
    default: ${{ github.repository }}
  token:
    description: >
      Personal access token (PAT) used to fetch the repository. The PAT is configured
      with the local git config, which enables your scripts to run authenticated git
      commands. The post-job step removes the PAT.
      We recommend using a service account with the least permissions necessary.
      Also when generating a new PAT, select the least scopes necessary.
      [Learn more about creating and using encrypted secrets](https://help.github.com/en/actions/automating-your-workflow-with-github-actions/creating-and-using-encrypted-secrets)
    required: false
    default: ${{ github.token }}
  submodules:
    description: >
      Whether to checkout submodules: `true` to checkout submodules or `recursive` to
      recursively checkout submodules.
    required: false
    default: false
  persist-credentials:
    description: >
      'Whether to configure the token or SSH key with the local git config'
    required: false
    default: true
  enableCrossOsArchive:
    description: >
      Whether the cache is cross-os compatible. This is useful to cache dependencies which
      are independent of the runner platform. This will help reduce the consumption of the
      cache quota and help build for multiple platforms from the same cache.
      [Learn more about cross-os caching](https://github.com/actions/cache/blob/main/tips-and-workarounds.md#cross-os-cache).
    required: false
    default: false

runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
        filter: ${{ inputs.filter }}
        path: ${{ inputs.path }}
        ref: ${{ inputs.ref }}
        repository: ${{ inputs.repository }}
        token: ${{ inputs.token }}
        submodules: ${{ inputs.submodules }}
        persist-credentials: ${{ inputs.persist-credentials }}
        clean: ${{ inputs.clean }}

    - name: Create LFS file list
      working-directory: ${{ inputs.path }}
      run: |
        {
          git lfs ls-files --long --include "${{ inputs.include }}" --exclude "${{ inputs.exclude }}"
          git submodule foreach --quiet git lfs ls-files --long --include "${{ inputs.include }}" --exclude "${{ inputs.exclude }}"
        } | cut -d ' ' -f1 | sort -u > .lfs-assets-id
      shell: bash

    # actions/cache and hashFiles resolve paths from $GITHUB_WORKSPACE, so prefix them with inputs.path
    - name: Create LFS cache paths
      working-directory: ${{ inputs.path }}
      run: |
        prefix="${INPUT_PATH#./}"
        [ "$prefix" = "." ] && prefix=""
        prefix="${prefix:+${prefix%/}/}"
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"

        # One path per line: the repo's LFS store, then each checked-out submodule's
        {
          echo "paths<<LFS_CACHE_PATHS"
          echo "${prefix}.git/lfs"
          git submodule foreach --quiet 'echo "$name"' | sed "s|^|${prefix}.git/modules/|; s|\$|/lfs|"
          echo "LFS_CACHE_PATHS"
        } >> "$GITHUB_OUTPUT"
      env:
        INPUT_PATH: ${{ inputs.path }}
      id: cache-paths
      shell: bash

    - name: Restore LFS cache
      uses: actions/cache@v6
      id: lfs-cache
      with:
        path: ${{ steps.cache-paths.outputs.paths }}
        key: lfs-v4-${{ inputs.repository }}-${{ hashFiles(format('{0}.lfs-assets-id', steps.cache-paths.outputs.prefix)) }}
        restore-keys: lfs-v4-${{ inputs.repository }}-
        enableCrossOsArchive: ${{ inputs.enableCrossOsArchive }}

    - name: Git LFS Pull
      working-directory: ${{ inputs.path }}
      run: |
        git lfs pull --include "${{ inputs.include }}" --exclude "${{ inputs.exclude }}"
        git submodule foreach --quiet git lfs pull --include "${{ inputs.include }}" --exclude "${{ inputs.exclude }}"
        git lfs prune
        git submodule foreach git lfs prune
      shell: bash

    # Don't leave behind temp files in case build system checks for dirty workspace
    - name: Clean up temp files
      working-directory: ${{ inputs.path }}
      if: always()
      run: rm .lfs-assets-id
      shell: bash
